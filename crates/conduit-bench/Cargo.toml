[package]
name = "conduit-bench"
description = "Runs the benchmark programs in tests/programs as Wasm, and measures them"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
conduit-effects = { path = "../conduit-effects" }
conduit-eval = { path = "../conduit-eval" }
conduit-ir = { path = "../conduit-ir" }
conduit-opt = { path = "../conduit-opt" }
conduit-test = { path = "../conduit-test", features = ["wasmtime"] }
conduit-wasm = { path = "../conduit-wasm" }
serde_json = "1.0.154"
wasmtime = "50.0.1"

[[test]]
name = "bench"
harness = false
