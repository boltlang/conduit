[package]
name = "conduit-wasm"
description = "Lowers Conduit IR to WebAssembly"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
conduit-ir = { path = "../conduit-ir" }
conduit-opt = { path = "../conduit-opt" }
wasm-encoder = "0.263.0"

[dev-dependencies]
conduit-eval = { path = "../conduit-eval" }
conduit-test = { path = "../conduit-test", features = ["wasmtime"] }
wasmparser = "0.263.0"
wasmprinter = "0.263.0"
wasmtime = "50.0.1"

[[test]]
name = "programs"
harness = false
