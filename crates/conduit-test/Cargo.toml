[package]
name = "conduit-test"
description = "Runs the test programs in tests/programs against each part of Conduit"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
conduit-ir = { path = "../conduit-ir" }
libtest-mimic = "0.8.2"
conduit-eval = { path = "../conduit-eval" }
wasmtime = { version = "50.0.1", optional = true }

[features]
# Running programs as Wasm, in `wasm`.
wasmtime = ["dep:wasmtime"]
